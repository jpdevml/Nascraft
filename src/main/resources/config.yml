# Nascraft (Ports edition) config.yml - ${project.version}
#
# Trading happens at local PORTS or the GLOBAL market (defined in ports.yml).
# Each market selects goods from items.yml. Managed goods use stock-based prices;
# player-only goods use escrowed player orders and never receive admin stock.

# Language file to use. Available: en_US es_ES it_IT de_DE pt_BR ru_RU zh_CN
language: 'en_US'

database:
  # sqlite (one server) or mysql (shared MariaDB for a network). A failed
  # mysql connection NEVER falls back to a local database.
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    name: nascraft
    username: nascraft
    password: 'change-me'
    ssl: false
    pool-size: 8
  # How many days should logs of trades last in the database?
  # Use -1 to disable (keep all trades logged).
  days-until-history-removed: 60

# Plain-text logging of every buy and sell. This is separate from the database
# log (viewable in-game with /nascraft log) and the optional Discord log below.
trade-log:
  # Print each trade to the server console (shows up in latest.log).
  console: false
  # Also append each trade to plugins/Nascraft/trades.log (with a timestamp).
  file: true

# Money is handled through Vault.
currency:
  format: "<gradient:#f09947:#feed81>[AMOUNT]$</gradient>"
  not-enough: "<gradient:#FB6363:#C4B3FD>✘ You don't have enough money to buy that!</gradient>"
  decimal-positions: 2
  top-limit: 9999999
  low-limit: 0.005

price-options:
  # With noise enabled, prices drift over time in a pseudo-random manner.
  noise:
    enabled: true
    default-intensity: 1
    intensity-multiplier: 1
    # Time in seconds between noise applications.
    time: 60
  # Stock-market style moves (replaces the noise above while enabled). Each tick (noise.time) a good's
  # price drifts back towards fair value, gets a random kick of `volatility` (log, per tick) and follows
  # a trend (bull run / slump / steady, 30-180 ticks). News events (shortages, gluts) jump it and fade
  # over a few hours. Trades push it: `depth` units bought move it up 1%.
  # Per good (items.yml or ports.yml): volatility, reversion, depth. volatility: 0 keeps a fixed price.
  market:
    enabled: true
    default-volatility: 0.006
    default-reversion: 0.02
    default-depth: 128
    # Chance per good per tick of a news event, and how big it is (fraction of price).
    event-chance: 0.002
    event-size: { min: 0.12, max: 0.35 }
    # Share of trend rolls that are bull or bear (the rest are steady).
    trend-chance: 0.6
    # Furthest the market can take a price from its supply-curve value (log; 0.9 = x0.4 to x2.5).
    max-swing: 0.9
    # Announce news headlines in chat.
    broadcast-news: true
  # The default elasticity applies to all goods unless overridden in items.yml or ports.yml.
  default-elasticity: 1
  elasticity-multiplier: 1

market-control:
  # If the market is closed players won't be able to buy/sell anywhere.
  closed: false

  # Starting stock for goods that don't define one (items.yml / ports.yml override this).
  default-starting-stock: 100

  # Default taxation, overridable per item (items.yml) and per port good (ports.yml).
  taxation:
    sell: 0.06
    buy: 0.04
    take-into-account-taxes: false

  # Do players need the permission "nascraft.market" to trade?
  market-permission: true

ports:
  announce-restock:
    enabled: true
    # true: announce restocks to the whole server.
    # false: only players inside the port hear about it.
    global: false

# Sounds used by the bazaar GUI; invalid names fall back to defaults.
bazaar:
  sounds:
    open: BLOCK_CHEST_OPEN
    click: UI_BUTTON_CLICK
    success: ENTITY_PLAYER_LEVELUP
    error: ENTITY_VILLAGER_NO

# Shares: cash-settled positions in managed goods (/market shares, the Portfolio page).
shares:
  enabled: true
  # Fee on each buy and sell (0.015 = 1.5%).
  fee: 0.015
  max-per-good: 2000

# The exchange GUI as CrusalisScreens pages (needs CrusalisScreens + PlaceholderAPI; falls back to
# the chest menus without them).
screens:
  enabled: true
  title: 'Crusalis Exchange'
  chart-every-seconds: 60

commands:
  nascraft:
    enabled: true
    alias: 'nas'
  market:
    enabled: true
    alias: 'port'
  link:
    enabled: true
    alias: 'nlink'
  discord:
    enabled: true
    alias: 'dis'
  sellall:
    enabled: true
    alias: 'nsellall'
  sellhand:
    enabled: true
    alias: 'nsellhand'
  sell-menu:
    enabled: true
    alias: 'sell'
    size: 45
    help:
      enabled: true
      slot: 4
      texture: 'bc8ea1f51f253ff5142ca11ae45193a4ad8c3ab5e9c6eec8ba7a4fcb7bac40'
    filler:
      material: 'black_stained_glass_pane'
    sell-button:
      slot: 40
      material: 'yellow_stained_glass_pane'
    close-button:
      enabled: true
      slot: 8
      material: 'red_stained_glass_pane'

discord-bot:
  enabled: false
  token: 'TOKEN-ID'
  # Role required to execute admin commands through discord.
  admin-role-id: 'ADMIN-ROLE-ID'
  # Available methods: NATIVE, DISCORDSRV
  link-method: 'NATIVE'
  # Channel to log every trade, with the port where it happened.
  log-trades:
    enabled: false
    channel: 'LOGS-TEXTCHANNEL-ID'

# Experimental: NBT keys to ignore when matching items.
ignored-keys:
  #- "Day"
