# Nascraft goods catalog - ${project.version}
# Categories drive the /market GUI; only goods in ports.yml are actually traded.
# Resource prices below are reference values only: player-only orders set real prices.
# Managed goods use a fixed price and a buy/sell spread (configured in ports.yml).

bazaar-categories:
  resources:
    name: 'Resources'
    icon: IRON_INGOT
    goods: [iron_ingot, gold_ingot, gunpowder, coal]
  blocks:
    name: 'Building Blocks'
    icon: OAK_PLANKS
    goods: [oak_log, spruce_log, birch_log, oak_planks, cobblestone, stone, dirt, sand, glass]
  crops:
    name: 'Crops & Raw Food'
    icon: WHEAT
    goods: [bamboo, wheat, potato, wheat_seeds, beef, mutton, porkchop]

items:
  iron_ingot: { initial-price: 10, alias: 'Iron Ingot' }
  gold_ingot: { initial-price: 50, alias: 'Nickel Ingot' }
  gunpowder: { initial-price: 50, alias: 'Gunpowder' }
  coal: { initial-price: 3, alias: 'Coal' }

  # One oak log crafts into four planks. Both trade at 2 / 0.5 before the
  # spread, so converting between them cannot generate money from the shop.
  oak_log: { initial-price: 2, alias: 'Oak Log' }
  spruce_log: { initial-price: 2, alias: 'Spruce Log' }
  birch_log: { initial-price: 2, alias: 'Birch Log' }
  oak_planks: { initial-price: 0.5, alias: 'Oak Planks' }
  cobblestone: { initial-price: 1, alias: 'Cobblestone' }
  stone: { initial-price: 2, alias: 'Stone' }
  dirt: { initial-price: 0.5, alias: 'Dirt' }
  sand: { initial-price: 1, alias: 'Sand' }
  glass: { initial-price: 2, alias: 'Glass' }

  bamboo: { initial-price: 0.2, alias: 'Bamboo' }
  wheat: { initial-price: 3, alias: 'Wheat' }
  potato: { initial-price: 3, alias: 'Potato' }
  wheat_seeds: { initial-price: 0.5, alias: 'Wheat Seeds' }
  # Vanilla Bukkit material IDs for raw meats are BEEF, MUTTON, PORKCHOP.
  beef: { initial-price: 5, alias: 'Raw Beef' }
  mutton: { initial-price: 5, alias: 'Raw Mutton' }
  porkchop: { initial-price: 5, alias: 'Raw Porkchop' }
