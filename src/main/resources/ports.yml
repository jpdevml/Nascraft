# Nascraft markets - ${project.version}
# Only the global market is configured. /market opens this Bazaar anywhere.
# Resources are player-only: no admin stock, no automatic restock. Players
# place buy/sell orders to supply them (or fill existing orders instantly).
# Blocks and crops are managed goods: initial stock and periodic restock make
# basic supplies available even without player orders.
# Managed goods have fixed prices (elasticity: 0, noise-intensity: 0) and a
# 20% buy / 20% sell spread. Buying from and immediately selling back to the
# market therefore always loses money. Adjust prices for your server economy.

global-market:
  display-name: '<gold>Global Market</gold>'
  restock: { min-minutes: 45, max-minutes: 90, amount: 512 }
  goods:
    # Player-backed resources: only player orders set the price.
    iron_ingot: { liquidity: player-only }
    gold_ingot: { liquidity: player-only }
    gunpowder: { liquidity: player-only }
    coal: { liquidity: player-only }

    # Common building supplies (no player order book).
    oak_log:       { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    spruce_log:    { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    birch_log:     { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    oak_planks:    { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    cobblestone:   { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    stone:         { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    dirt:          { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    sand:          { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    glass:         { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }

    # Farming and raw meats.
    bamboo:        { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 0.25, sell: 0.25}, starting-stock: 1012, restock-amount: 64 }
    wheat:         { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    potato:        { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    wheat_seeds:   { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 0.5, sell: 0.5}, starting-stock: 1012, restock-amount: 64 }
    beef:          { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    mutton:        { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }
    porkchop:      { liquidity: managed, elasticity: 0, noise-intensity: 0, tax: {buy: 1, sell: 1}, starting-stock: 1012, restock-amount: 64 }

# No location-restricted markets. Remove legacy ports here on existing installs
# (bundled resources are not copied over previously saved configuration files).
ports: {}
